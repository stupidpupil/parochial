runs-on: macOS-latest
parochial_merge:
  - env

steps:
  - uses: actions/checkout@v5

  - name: Get Date
    id: get-date
    run: |
      echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
    shell: bash

  - name: Cache TravelWhiz GTFS
    id: cache_travel_whiz_gtfs
    uses: actions/cache@v5
    with:
      path: output/gtfs/*.gtfs.zip*
      key: ${{ steps.get-date.outputs.date }}-${{ hashFiles('config.yml') }}-travelwhiz.gtfs-v1

  - parochial_replace_with: setup_r
    if: steps.cache_bods.outputs.cache-hit != 'true'

  - name: Download and prepare TravelWhiz GTFS
    if: steps.cache_bods.outputs.cache-hit != 'true'
    run: |
      devtools::load_all()
      download_travelwhiz_bus_metro_gtfs()
      download_travelwhiz_nationalrail_gtfs()
      prepare_gtfs()
    shell: Rscript {0}

  - name: Upload TravelWhiz GTFS artifact
    uses: actions/upload-artifact@v4
    with:
      name: travelwhiz.gtfs.zip
      path: output/gtfs/*.gtfs.zip*
      if-no-files-found: error
      compression-level: 0
