runs-on: macOS-latest
parochial_merge:
  - env

steps:
  - uses: actions/checkout@v6

  - name: Get Geofabrik Location
    id: geofabrik_location
    run : |
      echo "loc=$(curl -I 'https://download.geofabrik.de/europe/great-britain-latest.osm.pbf' | grep 'Location')" >> $GITHUB_OUTPUT

  - name: Cache OSM
    id: cache_osm
    uses: actions/cache@v5
    with:
      path: |
        output/openstreetmap/*
      key: ${{ steps.geofabrik_location.outputs.loc }}-${{ hashFiles('config.yml') }}-osm-v1

  - parochial_replace_with: setup_r
    if: steps.cache_osm.outputs.cache-hit != 'true'

  - parochial_replace_with: setup_osmium
    if: steps.cache_osm.outputs.cache-hit != 'true'
        
  - name: Download and prepare OSM
    if: steps.cache_osm.outputs.cache-hit != 'true'
    run: |
      devtools::load_all()
      download_and_prepare_osm()
    shell: Rscript {0}

  - name: Upload OpenStreetMap artifact
    uses: actions/upload-artifact@v7
    with:
      name: openstreetmap
      path: output/openstreetmap/*
      if-no-files-found: error
